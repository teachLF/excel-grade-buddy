name: Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build project
        run: |
          if [ -d "tamii" ]; then
            cd tamii
            npm install
            npm run build
            cd ..
            mkdir -p dist
            cp -r tamii/dist/* dist/ 2>/dev/null || cp -r tamii/dist dist 2>/dev/null || true
          fi
          if [ ! -d "dist" ]; then
            npm install
            npm run build
          fi
          ls -la
          ls -la dist || ls -la tamii/dist
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
